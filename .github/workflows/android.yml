name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Hercules Game/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
          cache-dependency-path: 'Hercules Game/gradle/wrapper/gradle-wrapper.properties'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-30 build-tools;30.0.0'

      - name: Make Gradle wrapper executable
        working-directory: Hercules Game
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: Hercules Game
        run: ./gradlew --no-daemon --stacktrace android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hercules-Game-debug-apk
          path: 'Hercules Game/android/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
